<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Ember</title>
<style>
:root{--ink:#e9dcc3;--dim:#a39a85;--bg:#14161c;--card:#1d2029;--ember:#ff8a3d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 115%,#3d2414 0,var(--bg) 62%) fixed;color:var(--ink);font:16px/1.45 Georgia,serif;display:flex;justify-content:center}
main{width:min(560px,100%);padding:20px 14px 40px}
h1{margin:0;font-size:30px}
.sub{color:var(--dim);margin:2px 0 12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.stat{background:var(--card);border-radius:8px;padding:6px 2px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--dim)}
.fire,.card{background:var(--card);padding:12px;border-radius:8px;margin-bottom:8px}
.bar{height:12px;background:#0d0f13;border-radius:6px;overflow:hidden;position:relative;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b8321a,var(--ember));transition:width .4s}
.bar u{position:absolute;top:0;height:100%;width:2px;background:var(--ink)}
.note{font-size:14px;color:var(--dim);margin:3px 0}
.warn{color:#ff7a66;font-weight:bold}
.hint{font-size:15px;margin:8px 0;color:var(--ember)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
button{font:inherit;color:var(--ink);background:#2a2e3a;border:1px solid #3a3f4e;border-radius:8px;padding:10px 12px;min-height:52px;cursor:pointer;text-align:left}
button:hover:not(:disabled){border-color:var(--ember)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ember)}
button:disabled{opacity:.5;cursor:not-allowed}
button small{display:block;color:var(--dim);font-size:12px}
kbd{font:11px monospace;border:1px solid #555;border-radius:4px;padding:0 4px;color:var(--dim)}
.wide{grid-column:1/3}
.end{width:100%;background:#4a2a14;border-color:var(--ember);text-align:center;font-weight:bold}
h2{font-size:15px;margin:14px 0 0;color:var(--dim);font-weight:normal}
#log{background:var(--card);border-radius:8px;padding:6px 14px;min-height:70px;font-size:14px;margin-top:10px}
#log p{margin:5px 0}
.foot{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--dim)}
.foot button{min-height:36px;padding:4px 10px;font-size:13px}
details{margin:8px 0;font-size:14px;color:var(--dim)}
summary{cursor:pointer}
input{font:inherit;background:#0d0f13;color:var(--ink);border:1px solid #3a3f4e;border-radius:6px;padding:4px 8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Last Ember</h1>
<div class="sub">Keep the fire alive. Every night it burns lower.</div>
<div id="app"></div>
<div id="log" aria-live="polite"></div>
</main>
<script>
// Balance values live here.
const CFG = { goal: 25, stoke: 30, wolf: 30, burn: 8, wind: 4, safe: 2,
  wx: { calm: ['Clear sky', 0], cold: ['Cold snap', 8], storm: ['Storm', 20] } };
const BUILDS = {
  wind: { n: 'Windbreak', c: 6, d: 'Fire burns 4 slower each night', k: '1' },
  pal:  { n: 'Palisade', c: 8, d: 'Wolves 70% less likely to get in', k: '2' },
  rack: { n: 'Drying rack', c: 5, d: 'Foraging finds 1 extra food', k: '3' }
};
const NAMES = ['Cora','Dev','Elin','Finn','Gita','Hugo','Iris','Joss','Kai','Lena','Milo','Nia','Omar','Pia'];
const EVENTS = [
  { id: 'stranger', p: .2, text: 'A stranger waits at the edge of the light.', opts: [
    { l: 'Take them in', s: '+1 person, eats 1 food a night', f: () => {
      const pool = NAMES.filter(n => !S.people.includes(n)), n = pool[rnd(0, pool.length - 1)] || 'Wanderer';
      S.people.push(n); S.ap++; S.joined++; return n + ' joins you: one more pair of hands, one more mouth.'; } },
    { l: 'Turn them away', s: 'Keep your supplies', f: () => 'You turned them away.' }] },
  { id: 'trader', p: .1, text: 'A trader offers a swap.', opts: [
    { l: '3 food for 5 wood', ok: () => S.food >= 3, why: 'Needs 3 food', f: () => { S.food -= 3; S.wood += 5; return 'Traded 3 food for 5 wood.'; } },
    { l: '3 wood for 5 food', ok: () => S.wood >= 3, why: 'Needs 3 wood', f: () => { S.wood -= 3; S.food += 5; return 'Traded 3 wood for 5 food.'; } },
    { l: 'No deal', s: '', f: () => 'The trader moves on.' }] },
  { id: 'cache', p: .1, text: 'You find a buried food cache. Digging it up is loud.', opts: [
    { l: 'Dig it up', s: '+4 food, wolves can come at a higher fire tonight', f: () => { S.food += 4; S.noise = 1; return 'Found 4 food. The noise may draw wolves.'; } },
    { l: 'Leave it', s: 'Stay quiet', f: () => 'You left it buried.' }] }
];

let S = null, V = 'title', best = 0, snd = 0;
try { best = +localStorage.getItem('lastEmberBest') || 0; } catch (e) {}
const $ = id => document.getElementById(id), P = () => S.people.length;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const EV = id => EVENTS.find(e => e.id === id);
const load = () => { try { return JSON.parse(localStorage.getItem('lastEmberSave')); } catch (e) { return null; } };
function save() {
  try { (S && !S.over && !S.won) ? localStorage.setItem('lastEmberSave', JSON.stringify(S)) : localStorage.removeItem('lastEmberSave'); } catch (e) {}
}
// Seeded roll: weather and events depend only on seed + day, not on player actions.
function R(d, k) {
  let a = (S.seed * 7919 + d * 131 + k * 17) >>> 0;
  a = Math.imul(a ^ a >>> 15, a | 1); a ^= a + Math.imul(a ^ a >>> 7, a | 61);
  return ((a ^ a >>> 14) >>> 0) / 4294967296;
}
function beep(f, t) {
  if (!snd) return;
  try {
    const c = beep.c || (beep.c = new AudioContext()), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = f; g.gain.value = .05; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + t);
  } catch (e) {}
}
function wx(d) {
  if (d <= CFG.safe) return 'calm';
  const r = R(d, 1), k = Math.min(.3, .08 + d * .01);
  return r < k ? 'storm' : r < k + .2 ? 'cold' : 'calm';
}
const decay = () => Math.max(4, CFG.burn + S.day + CFG.wx[wx(S.day)][1] - (S.built.wind ? CFG.wind : 0));
const thr = () => CFG.wolf + (S.noise ? 25 : 0);
function wolfP() { let p = Math.min(.8, .45 + S.day * .01); return S.built.pal ? p * .3 : p; }
function risk(proj) {
  if (S.day <= CFG.safe || proj >= thr()) return 'None';
  const p = wolfP(); return p < .2 ? 'Low' : p < .45 ? 'Medium' : 'High';
}

function newGame(seed) {
  seed = Math.abs(parseInt(seed)) || rnd(1000, 9999);
  S = { seed, day: 1, ap: 2, wood: 6, food: 4, fire: 60, built: {}, people: ['Asha', 'Ben'], ev: null,
        over: 0, won: 0, endless: 0, noise: 0, joined: 0, cause: '', score: 0,
        log: ['Night 1 is calm and safe. Learn the routine.'] };
  V = 'game'; render();
}
function nextDay() {
  S.day++; S.ap = P(); S.ev = null;
  if (S.day < 3) return;
  const r = R(S.day, 2); let c = 0;
  for (const e of EVENTS) { c += e.p; if (r < c) { S.ev = e.id; return; } }
}
function kill(m, why, verb) {
  const n = S.people.splice(rnd(0, P() - 1), 1)[0];
  S.cause = why + ' ' + n + ' ' + verb; m.push(S.cause); beep(140, .4);
}

function go(a, i) {
  if (a === 'new') { const sd = $('seed'); return newGame(sd ? sd.value : 0); }
  if (a === 'daily') { const d = new Date(); return newGame(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()); }
  if (a === 'cont') { S = load(); V = S ? 'game' : 'title'; return render(); }
  if (a === 'reset') {
    if (confirm('Erase your saved run and best score?')) {
      try { localStorage.removeItem('lastEmberSave'); localStorage.removeItem('lastEmberBest'); } catch (e) {}
      best = 0; S = null;
    }
    return render();
  }
  if (a === 'snd') { snd = !snd; beep(440, .1); return render(); }
  if (a === 'menu') { V = 'title'; return render(); }
  if (!S || S.over) return;
  if (a === 'keep' && S.won) { S.won = 0; S.endless = 1; nextDay(); S.log = ['The search party passed. The winter goes on.']; return render(); }
  if (S.won) return;
  if (S.ev) {
    if (a !== 'opt') return;
    const o = EV(S.ev).opts[i];
    if (!o || (o.ok && !o.ok())) return;
    const msg = o.f(); S.ev = null; S.log = [msg]; return render();
  }
  if (a === 'end') return endDay();
  if (S.ap < 1) return;
  let msg;
  if (a === 'chop') { const n = rnd(2, 4); S.wood += n; msg = `Chopped ${n} wood. You have ${S.wood}, enough for ${Math.floor(S.wood / 2)} stokes.`; }
  else if (a === 'forage') {
    const n = rnd(1, 3) + (S.built.rack ? 1 : 0); S.food += n;
    msg = `Foraged ${n} food. You have ${S.food}; that feeds everyone for ${Math.floor(S.food / P())} night(s).`;
  } else if (a === 'stoke') {
    if (S.wood < 2) return;
    S.wood -= 2; S.fire = Math.min(100, S.fire + CFG.stoke); beep(520, .15);
    msg = `Stoked the fire to ${S.fire}. Tonight it will end near ${Math.max(0, S.fire - decay())}.`;
  } else if (a.startsWith('b:')) {
    const k = a.slice(2), B = BUILDS[k];
    if (!B || S.built[k] || S.wood < B.c) return;
    S.wood -= B.c; S.built[k] = 1; msg = `Built the ${B.n}. ${B.d}.`;
  } else return;
  S.ap--; S.log = [msg]; render();
}

function endDay() {
  const m = [], d = decay();
  S.fire = Math.max(0, S.fire - d);
  m.push(`Night ${S.day} (${CFG.wx[wx(S.day)][0].toLowerCase()}): the fire burned down by ${d} to ${S.fire}.`);
  if (S.food >= P()) S.food -= P(); else { S.food = 0; kill(m, 'Not enough food.', 'starved.'); }
  if (P() && S.fire === 0) kill(m, 'The fire died.', 'froze in the dark.');
  if (P() && S.day > CFG.safe && S.fire < thr()) {
    if (Math.random() < wolfP()) kill(m, 'Wolves came for the weak fire.', 'was lost to the pack.');
    else m.push('Wolves circled the dim fire, then left.');
  }
  S.noise = 0;
  if (!P()) { S.over = 1; S.score = S.day - 1; m.push('The last ember went out.'); }
  else if (S.day >= CFG.goal && !S.endless) { S.won = 1; S.score = S.day; }
  else nextDay();
  if ((S.over || S.won) && S.score > best) { best = S.score; try { localStorage.setItem('lastEmberBest', best); } catch (e) {} }
  if (S.ev) m.push(EV(S.ev).text);
  S.log = m; render();
}

function hint(proj) {
  const first = S.day === 1 ? 'First night: ' : '';
  if (S.ap < 1) return first + 'Out of actions. End the day.';
  if (S.food < P()) return first + 'Food is short. Forage so everyone eats tonight.';
  if (S.day > CFG.safe && proj < thr()) return first + (S.wood >= 2 ? 'The fire will fall into wolf range. Stoke it.' : 'The fire will fall into wolf range. Chop wood, then stoke.');
  if (S.wood < 2) return first + 'Low on wood. Chop some.';
  return first + 'Spare actions: stock wood and food for harder nights, or build.';
}
const help = () => `<details><summary>How it works</summary>
<p>Each person gives you 1 action a day, and each eats 1 food every night.</p>
<p>Each night the fire burns down by ${CFG.burn} plus the day number, plus weather (cold +8, storm +20), minus the windbreak.</p>
<p>At 0 fire someone freezes. Below ${CFG.wolf}, wolves may come. Nights 1 and 2 are safe.</p>
<p>Reach night ${CFG.goal} and a search party may spot your fire. Weather and events are set by the seed, so the same seed replays the same winter.</p>
<p>Progress saves in this browser only. Clearing browser data or using private mode erases it.</p></details>`;
function btn(a, l, s, ok, why, k, i) {
  return `<button data-a="${a}"${i != null ? ` data-i="${i}"` : ''}${ok ? '' : ' disabled'}>${l}${k ? ' <kbd>' + k + '</kbd>' : ''}<small>${ok ? s : why}</small></button>`;
}

function render() {
  const el = $('app'), lg = $('log');
  if (V === 'title') {
    const sv = load();
    lg.style.display = 'none';
    el.innerHTML = `<p class="note">Goal: keep a fire alive until night ${CFG.goal}. Best: ${best} nights.</p>` + help() +
      `<div class="grid">${sv && !sv.over && !sv.won ? btn('cont', 'Continue run', 'Night ' + sv.day + ', seed ' + sv.seed, 1) : ''}` +
      btn('new', 'New run', 'Random seed, or type one below', 1) + btn('daily', 'Daily run', 'Same winter for everyone today', 1) +
      btn('reset', 'Erase saved data', 'Asks first', 1) + `</div><label class="note">Seed (optional) <input id="seed" inputmode="numeric" size="8"></label>`;
    return;
  }
  save(); lg.style.display = '';
  const d = decay(), proj = Math.max(0, S.fire - d), th = thr(), rk = risk(proj);
  const bl = Object.keys(S.built).map(k => BUILDS[k].n).join(', ') || 'nothing';
  const story = `You took in ${S.joined} stranger(s) and built ${bl}.`;
  let h = `<p class="note">Goal: reach night ${CFG.goal}${S.endless ? ' (done, now endless)' : ''}. Best: ${best}.</p>`;
  if (S.over || S.won) {
    h += `<div class="card"><b>${S.over ? 'You survived ' + S.score + ' nights.' : 'Night ' + CFG.goal + ': a search party sees your fire.'}</b>` +
      `<p>${S.over ? S.cause + ' ' + story : P() + ' of you made it: ' + S.people.join(', ') + '. ' + story}</p></div>` +
      `<div class="grid">${S.won ? btn('keep', 'Keep going', 'Endless mode', 1) : ''}${btn('new', 'Play again', 'New random seed', 1)}</div>`;
  } else {
    h += `<div class="stats">${[[S.day, 'Night'], [P(), 'People'], [S.wood, 'Wood'], [S.food, 'Food'], [S.ap, 'Actions']]
      .map(x => `<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>` +
      `<div class="fire"><div>Fire ${S.fire} / 100</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${S.fire}">` +
      `<i style="width:${S.fire}%"></i><u style="left:${th}%"></u></div>` +
      `<p class="note">Tonight: ${CFG.wx[wx(S.day)][0]}, burns ${d}. Tomorrow: ${CFG.wx[wx(S.day + 1)][0]}.</p>` +
      `<p class="note ${rk !== 'None' ? 'warn' : ''}">Fire ends near ${proj}. Wolf danger: ${rk}${rk !== 'None' ? ' (fire below ' + th + ')' : ''}.</p>` +
      `<p class="note">Camp: ${S.people.join(', ')}. Food needed tonight: ${P()}.</p></div>` +
      `<p class="hint">${hint(proj)}</p>`;
    if (S.ev) {
      h += `<h2>${EV(S.ev).text}</h2><div class="grid">${EV(S.ev).opts.map((o, i) => btn('opt', o.l, o.s, !o.ok || o.ok(), o.why, i + 1, i)).join('')}</div>`;
    } else {
      const a = S.ap > 0, no = 'No actions left';
      h += `<h2>Actions left today: ${S.ap}</h2><div class="grid">` +
        btn('chop', 'Chop wood', '+2 to 4 wood', a, no, 'c') +
        btn('forage', 'Forage', '+1 to 3 food' + (S.built.rack ? ' (+1 rack)' : ''), a, no, 'f') +
        btn('stoke', 'Stoke fire', '2 wood, +' + CFG.stoke + ' fire', a && S.wood >= 2, a ? 'Needs 2 wood' : no, 's') +
        Object.keys(BUILDS).filter(k => !S.built[k]).map(k => btn('b:' + k, 'Build ' + BUILDS[k].n, BUILDS[k].c + ' wood. ' + BUILDS[k].d, a && S.wood >= BUILDS[k].c, a ? 'Needs ' + BUILDS[k].c + ' wood' : no, BUILDS[k].k)).join('') +
        `</div><button class="end" data-a="end">End day <kbd>e</kbd></button>`;
    }
  }
  h += `<div class="foot">Seed ${S.seed}<button data-a="snd" aria-pressed="${!!snd}">Sound: ${snd ? 'on' : 'off'}</button><button data-a="menu">Menu</button></div>`;
  el.innerHTML = h;
  lg.innerHTML = S.log.map(t => '<p>' + t + '</p>').join('');
}

$('app').addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && !b.disabled) go(b.dataset.a, b.dataset.i != null ? +b.dataset.i : null);
});
addEventListener('keydown', e => {
  if (V !== 'game' || !S || e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (S.ev) { const n = +k; if (n >= 1 && n <= 3) go('opt', n - 1); return; }
  const m = { c: 'chop', f: 'forage', s: 'stoke', e: 'end' };
  if (m[k]) return go(m[k]);
  const b = Object.keys(BUILDS).find(x => BUILDS[x].k === k);
  if (b) go('b:' + b);
});
render();
</script>
</body>
</html>
